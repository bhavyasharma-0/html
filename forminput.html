<form>
 <label>Name:</label> <!-- label for name-->
 <input type="text"> <!-- always specify what type of input you want from user-->
 
 <br><br>

 <label>Email:</label> <!-- label for email--> 
  <input type="email">

  <br><br>

  <label>Password:</label> <!-- to input password-->
  <input type="password">

  <br><br>

  <label>Upload your file:</label> <!-- to upload a file-->
  <input type="file">
  
  <br><br>
  
  <!-- submit button -->
   <button type="submit">Submit</button> <!-- button to click for the user to submit the form-->
</form>
